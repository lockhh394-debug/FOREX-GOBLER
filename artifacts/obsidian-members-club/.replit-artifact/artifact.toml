kind = "web"
previewPath = "/"
title = "Forex Gobler | Obsidian Members Club"
description = "Forex Gobler systems for people building leverage, discipline, and their next move."
version = "1.0.0"
id = "artifacts/obsidian-members-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21644

[services.development]
run = "pnpm --filter @workspace/obsidian-members-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/obsidian-members-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/obsidian-members-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21644"
BASE_PATH = "/"
